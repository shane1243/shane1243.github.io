  <link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    (() => {
      document.documentElement.classList.add('js');
      window.setTimeout(() => document.documentElement.classList.add('ready'), 1200);
      let theme;
      try { theme = localStorage.getItem('zhiqiangqin-theme'); } catch {}
      document.documentElement.dataset.theme = theme === 'light' || theme === 'dark'
        ? theme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    })();
  </script>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
  <script type="module" src="/background.js"></script>
  <noscript><style>#language-toggle,#theme-toggle{display:none}</style></noscript>
</head>

  <div id="ambient-background" class="ambient-background" aria-hidden="true"><canvas id="ambient-canvas"></canvas></div>

  <header class="site-header">
    <a class="monogram" href="/" aria-label="zhiqiangqin home" data-i18n-label="home">zq<span>.</span></a>

      </button>
    </nav>
  </header>

  <main class="page" id="main" tabindex="-1">

      </div>
    </div>
